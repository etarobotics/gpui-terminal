[package]
name = "gpui-terminal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Terminal emulator component for gpui"
repository = "https://github.com/zortax/gpui-terminal"
authors = ["Leonard Seibold <git[@]zrtx.de"]

[dependencies]
gpui = "0.2.2"
# Our fork's nh/wasm32-support: gates the native-only pty event loop
# (event_loop/thread/tty — polling has no wasm32 backend at all) so this
# crate itself can target wasm32.
alacritty_terminal = { git = "https://github.com/etarobotics/alacritty", rev = "b704600ef81422a911294ad8e718d5af89eaf4fd" }
anyhow = "1"
ropey = "1"
parking_lot = "0.12"
flume = "0.12"
tracing = "0.1"

# Only ever used by this crate's own `src/main.rs` demo (never by the
# library) and doesn't build for wasm32 (no OS pty on that target) — native
# only. See patch notes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
portable-pty = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.arboard]
version = "3"
features = ["wayland-data-control"]
